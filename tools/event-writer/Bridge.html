<!doctype html><html><head><meta charset="utf-8"></head><body><p>Подключение календаря отдела</p><script>
const channel=__CHANNEL__,origin='https://pirhavko85-droid.github.io';
window.addEventListener('message',event=>{
 if(event.origin!==origin||event.source!==window.top||event.data?.channel!==channel||event.data.type!=='department-add')return;
 const id=event.data.requestId;
 google.script.run.withSuccessHandler(result=>window.top.postMessage({type:'department-result',channel,requestId:id,result},origin)).withFailureHandler(()=>window.top.postMessage({type:'department-result',channel,requestId:id,result:{ok:false,message:'Сервис записи недоступен. Повторите позже.'}},origin)).addDepartmentEvent(event.data.event,id);
});
window.top.postMessage({type:'department-ready',channel},origin);
</script></body></html>
