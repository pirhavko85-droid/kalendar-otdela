<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f5f7fa;color:#17212b}main{max-width:560px;margin:32px auto;padding:24px}h1{font-size:25px}button,a{font:inherit}button{background:#286bed;color:white;border:0;border-radius:10px;padding:13px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#state{padding:16px 0}small{color:#596777;overflow-wrap:anywhere}a{color:#164b93}p{margin:12px 0}
</style></head><body><main><h1>Обновление календаря отдела</h1><small id="account"></small><p>Запустить чтение общей Google-таблицы и публикацию свежих данных для всего отдела.</p><button id="start">Синхронизировать с Google-таблицей</button><p id="state" role="status" aria-live="polite">Готово к запуску.</p><p><a href="https://pirhavko85-droid.github.io/kalendar-otdela/" target="_blank" rel="noopener">Вернуться в дашборд</a></p><small>Синхронизация выполняется на сервере. Можно закрыть страницу — процесс продолжится. Повторные нажатия не создают параллельных запусков.</small></main><script>
const session=__SESSION__;
document.getElementById('account').textContent='Аккаунт: '+session.email;
const button=document.getElementById('start'),status=document.getElementById('state');let timer=null;
function fail(e){clearTimeout(timer);button.disabled=false;status.textContent=e&&e.message?e.message:'Не удалось проверить обновление. Сообщите Роману.';}
function show(s){status.textContent=s.message;const busy=['queued','running'].includes(s.phase);button.disabled=busy;clearTimeout(timer);if(busy)timer=setTimeout(check,7000);}
function check(){google.script.run.withSuccessHandler(show).withFailureHandler(fail).getSyncStatus(session.nonce);}
button.onclick=()=>{button.disabled=true;status.textContent='Отправляю запрос…';google.script.run.withSuccessHandler(show).withFailureHandler(fail).startSync(session.nonce);};
check();
</script></body></html>
