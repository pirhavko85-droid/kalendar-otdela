name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files only
        run: |
          mkdir public-site
          cp index.html sw.js manifest.json data.enc.json leave-extension.js leave-accounting.js event-draft.js event-card.js collaboration.js .nojekyll public-site/
          cp -R icons public-site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
          name: github-pages-${{ github.run_attempt }}
      # Artifact metadata can lag behind a successful upload. A rerun must also
      # avoid colliding with the previous attempt's identically named artifact.
      - name: Allow uploaded artifact metadata to settle
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Retry the same uploaded artifact after a transient Pages failure
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

